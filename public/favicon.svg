<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A8" />
      <stop offset="35%" stop-color="#DFB971" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8F6E28" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0F19" />
      <stop offset="100%" stop-color="#1A050A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep royal backdrop pill for high-contrast visibility on both light and dark browser tabs -->
  <rect width="100" height="100" rx="24" fill="url(#bg)" />
  <rect width="96" height="96" x="2" y="2" rx="22" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

  <!-- Brand Concentric Hexagon & Center Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Hexagon -->
    <polygon
      points="50,14 81.2,32 81.2,68 50,86 18.8,68 18.8,32"
      stroke="url(#gold)"
      stroke-width="5.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Inner Hexagon -->
    <polygon
      points="50,28 69.1,39 69.1,61 50,72 30.9,61 30.9,39"
      stroke="url(#gold)"
      stroke-width="3.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"
    />
    <!-- Center Dot -->
    <circle cx="50" cy="50" r="6.5" fill="url(#gold)" />
  </g>
</svg>